name: flutter_playground
description: A real-time component playground for Flutter. Tweak properties on a web dashboard and see changes instantly on your device.
version: 0.1.0
homepage: https://github.com/rajparihar281/flutter_playground

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_playground
        pluginClass: FlutterPlaygroundPlugin
      ios:
        pluginClass: FlutterPlaygroundPlugin
